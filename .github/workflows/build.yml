name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Release on purpose: it is what ships, and warnings are errors in every configuration.
      - name: Build (Release)
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build
